<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>Your Name</h1>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero">
        <h2>Welcome to my futuristic portfolio</h2>
        <p>Insert a short tagline here.</p>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>Write a short bio here.</p>
    </section>

    <section id="projects">
        <h2>Projects</h2>
        <div class="project-grid">
            <!-- Duplicate this block for each project -->
            <article class="project">
                <img src="https://via.placeholder.com/300x200" alt="Project image">
                <h3>Project Title</h3>
                <p>A short description of the project.</p>
            </article>
        </div>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form id="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; <span id="year"></span> Your Name</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
